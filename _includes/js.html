<script>
// @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&dn=expat.txt Expat
    const themePreference = () => {
        const hasLocalStorage = localStorage.getItem('theme');
        let supports = false;
        let theme = undefined;

        if (hasLocalStorage === 'light') {
            theme = 'light';
        }
        if (hasLocalStorage === 'dark') {
            theme = 'dark';
        }

        if (window.matchMedia(`(prefers-color-scheme: dark)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'dark';
            supports = true;
        };
        if (window.matchMedia(`(prefers-color-scheme: light)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'light';
            supports = true;
        };
        if (window.matchMedia(`(prefers-color-scheme: no-preference)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'none';
            supports = true;
        };

        return {
            supports,
            theme
        };
    }

    document.addEventListener('DOMContentLoaded', e => {
        console.clear();

        const userThemePreference = themePreference();
        const toggles = document.querySelectorAll('[theme_toggle]');
        const html = document.documentElement;

        const setTheme = theme => {
            html.classList.toggle('dark', theme === 'dark');
            html.classList.toggle('light', theme === 'light');
            toggles.forEach(toggle => {
                toggle.setAttribute('aria-pressed', toggle.dataset.theme === theme);
            });
        };

        setTheme(userThemePreference.theme);
        toggles.forEach(toggle => toggle.addEventListener('click', () => {
            const theme = toggle.dataset.theme;
            if (theme === 'dark') {
                html.classList.add('dark');
                html.classList.remove('light');
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
            }
            localStorage.setItem('theme', theme);
            setTheme(theme);
        }, false));
    }, false);
// @license-end
</script>
