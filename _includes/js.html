<script>
// @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&dn=expat.txt Expat
    const themePreference = () => {
        const hasLocalStorage = localStorage.getItem('theme');
        let supports = false;
        let theme = undefined;

        if (hasLocalStorage === 'light') {
            theme = 'light';
        }
        if (hasLocalStorage === 'dark') {
            theme = 'dark';
        }

        if (window.matchMedia(`(prefers-color-scheme: dark)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'dark';
            supports = true;
        };
        if (window.matchMedia(`(prefers-color-scheme: light)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'light';
            supports = true;
        };
        if (window.matchMedia(`(prefers-color-scheme: no-preference)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'none';
            supports = true;
        };

        return {
            supports,
            theme
        };
    }

    document.addEventListener('DOMContentLoaded', e => {
        console.clear();

        const userThemePreference = themePreference();
        const toggle = document.querySelector('[theme_toggle]');
        const html = document.documentElement;

        const setTheme = theme => {
            const activeTheme = theme === 'dark' ? 'dark' : 'light';
            html.classList.toggle('dark', activeTheme === 'dark');
            html.classList.toggle('light', activeTheme === 'light');
            toggle.textContent = activeTheme === 'dark' ? 'Light mode' : 'Dark mode';
            toggle.setAttribute('aria-label', `Switch to ${activeTheme === 'dark' ? 'light' : 'dark'} mode`);
        };

        setTheme(userThemePreference.theme);
        toggle.addEventListener('click', () => {
            const theme = html.classList.contains('dark') ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            setTheme(theme);
        }, false);
    }, false);
// @license-end
</script>
