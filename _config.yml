
title: wani1209.github.io #Your awesome title
email: wani.wynn@gmail.com #youremail@domain.com
description: > # this means to ignore newlines until "baseurl"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.

baseurl: "" # the subpath of the site
url: "https://wani1209.github.io" # the base hostname & protocol for your site

# :categories is read from post front matter, not the _posts directory name.
# Subdirectories are optional; when used, they must match the categories prefix.
permalink: /:categories/:title

favicon: /assets/img/favicon.ico

google_analytics: #UA—XXXXXXXX-X
disqus_shortname: #disqus shortname
cusdis:
    app_id: #your cusdis app_id

user:
  name: wani1209.github.io
  pic: /assets/img/profile.JPG
  picAlt: "wani1209.github.io"
  job: 
  aboutme: true # comment this out if you don't need the 'about' page.

exclude:
  - README.md
  - LICENSE
  - github

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      comment: true
markdown: kramdown
kramdown:
  math_engine: mathjax
